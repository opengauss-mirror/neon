# Neon 分布式部署配置文件
# 用户只需修改此文件，然后运行 deploy_neon.sh 即可

# ============================================
# 基本配置 - 必须修改
# ============================================

# 机器A（本机）配置
MACHINE_A_IP=<机器A的IP地址>
NEON_SOURCE_A_DIR=<机器A源代码目录>
NEON_BIN_A_DIR="${NEON_SOURCE_A_DIR}/target/release"
NEON_DATA_A_DIR=<机器A数据存储目录>

# 机器B（远程）配置
MACHINE_B_IP=<机器B的IP地址>
MACHINE_B_USER=<机器B的SSH用户名>
NEON_SOURCE_B_DIR=<机器B源代码目录>
NEON_BIN_B_DIR="${NEON_SOURCE_B_DIR}/target/release"
NEON_DATA_B_DIR=<机器B数据存储目录>

# ============================================
# 组件分布配置 - 根据需要修改
# ============================================

# Pageserver 主机配置（修改这里决定 pageserver 在哪台机器）
p_host1=${MACHINE_A_IP}
p_host2=${MACHINE_B_IP}
p_host3=${MACHINE_B_IP}

# Safekeeper 主机配置（修改这里决定 safekeeper 在哪台机器）
s_host1=${MACHINE_A_IP}
s_host2=${MACHINE_B_IP}
s_host3=${MACHINE_B_IP}

# ============================================
# Neon 配置 - 一般不需要修改
# ============================================

default_tenant_id = "ef87a5bf0d92544f6fafeeb3239695c0"
generate_local_ssl_certs = false
control_plane_api = 'http://${MACHINE_A_IP}:6082/upcall/v1/'

# ============================================
# Pageserver 配置
# ============================================

[[pageservers]]
id=1
listen_pg_addr = '${p_host1}:62000'
listen_http_addr = '${p_host1}:7898'
listen_grpc_addr = '${p_host1}:49051'
pg_auth_type = 'Trust'
http_auth_type = 'Trust'
grpc_auth_type = 'Trust'

[[pageservers]]
id=2
listen_pg_addr = '${p_host2}:62001'
listen_http_addr = '${p_host2}:7899'
listen_grpc_addr = '${p_host2}:49052'
pg_auth_type = 'Trust'
http_auth_type = 'Trust'
grpc_auth_type = 'Trust'

[[pageservers]]
id=3
listen_pg_addr = '${p_host3}:62002'
listen_http_addr = '${p_host3}:7900'
listen_grpc_addr = '${p_host3}:49053'
pg_auth_type = 'Trust'
http_auth_type = 'Trust'
grpc_auth_type = 'Trust'

# ============================================
# Safekeeper 配置
# ============================================

[[safekeepers]]
id = 1
pg_port = 3454
http_port = 5676
listen_addr = '${s_host1}'

[[safekeepers]]
id = 2
pg_port = 3455
http_port = 5677
listen_addr = '${s_host2}'

[[safekeepers]]
id = 3
pg_port = 3456
http_port = 5678
listen_addr = '${s_host3}'

# ============================================
# 其他服务配置
# ============================================

[broker]
listen_addr = '${MACHINE_A_IP}:48051'

[endpoint_storage]
listen_addr = '127.0.0.1:7993'

[storage_controller]
max_offline = "10s"
max_warming_up = "30s"
heartbeat_interval = "1s"
use_local_compute_notifications = true
database_url = "127.0.0.1:6083"
