apiVersion: v1
kind: Service
metadata:
  name: serverlessdb-operator
  namespace: serverlessdb
spec:
  selector:
    app: serverlessdb-operator
  ports:
    - name: api
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 8081
      targetPort: 8081
    - name: health
      port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: branching-pool-client
  namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: branching-pool-client
  namespace: __NAMESPACE__
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["serverlessdb.openfuyao.cn"]
    resources: ["dbinstances"]
    verbs: ["get", "list", "patch", "delete"]
  - apiGroups: ["serverlessdb.openfuyao.cn"]
    resources: ["dbinstances/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch", "delete"]
  # The branching coordinator owns durable operation metadata and routing caches.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["serverlessdb.openfuyao.cn"]
    resources: ["dbresourcepools"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: branching-pool-client
  namespace: __NAMESPACE__
subjects:
  - kind: ServiceAccount
    name: branching-pool-client
    namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: branching-pool-client