---
apiVersion: v1
kind: Service
metadata:
  name: safekeeper1
  namespace: __NAMESPACE__
spec:
  selector:
    app.kubernetes.io/name: safekeeper1
  ports:
    - name: pg
      port: 5454
      targetPort: pg
    - name: http
      port: 7676
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safekeeper1
  namespace: __NAMESPACE__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: safekeeper1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safekeeper1
        app.kubernetes.io/part-of: opengauss-branching
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: __NODE_NAME__
      securityContext:
        fsGroup: 1000
        seLinuxOptions:
          type: spc_t
      initContainers:
        - name: prepare-data
          image: __STORAGE_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["/bin/sh", "-ec"]
          args: ["mkdir -p /data/.neon/safekeeper && chown -R 1000:1000 /data/.neon/safekeeper"]
          volumeMounts:
            - name: data
              mountPath: /data/.neon/safekeeper
      containers:
        - name: safekeeper
          image: __STORAGE_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["safekeeper"]
          args:
            - --listen-pg=0.0.0.0:5454
