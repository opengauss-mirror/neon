apiVersion: v1
kind: Service
metadata:
  name: compute-main
  namespace: __NAMESPACE__
spec:
  selector:
    app.kubernetes.io/name: compute-main
  ports:
    - name: postgres
      port: 55433
      targetPort: postgres
    - name: http
      port: 3080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-main
  namespace: __NAMESPACE__
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: compute-main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compute-main
        app.kubernetes.io/part-of: opengauss-branching
        app.kubernetes.io/component: compute
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: __NODE_NAME__
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: prepare-data
          image: __COMPUTE_IMAGE__
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["/bin/bash", "-ec"]
          args:
            - |
              mkdir -p /work/gaussdb/compute /work/gaussdb/configs /data/.neon/control_plane/endpoints/main/timeline-creation
              cp /var/db/gaussdb/configs/config.json /work/gaussdb/configs/config.json
              touch /work/gaussdb/postgresql_extend.conf
              chmod -R 0777 /work/gaussdb
              chown -R 1000:1000 /work/gaussdb /data/.neon/control_plane
          volumeMounts:
            - name: data
              mountPath: /work/gaussdb
            - name: control-plane
              mountPath: /data/.neon/control_plane
      containers:
        - name: compute
          image: __COMPUTE_IMAGE__
          imagePullPolicy: Never
          command: ["/opt/branching/compute.sh"]
          env:
            - name: COMPUTE_CTL_POOL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: branching-pool-api
                  key: token
            - name: OG_VERSION
              value: __OG_VERSION__
            - name: STORAGE_CONTROLLER_HTTP
              value: http://storage-controller:1234
            - name: ENDPOINT_ID
              value: main
            - name: ENDPOINT_SERVICE_NAME
              value: compute-main
            - name: ENDPOINT_STATUS_DIR
              value: /data/.neon/control_plane/endpoints/main
            - name: OGGIT_ENABLED
              value: "true"
            - name: SAFEKEEPER_CONNSTRINGS
              value: safekeeper:5454
            - name: OGGIT_SAFEKEEPER_HTTP_URLS
              value: http://safekeeper:7676
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: COMPUTE_REMOTE_HBA_CIDR
              value: 10.244.0.0/16
            - name: BRANCH_MERGE_USER_ENABLED
              value: "true"
            - name: BRANCH_MERGE_USER
              valueFrom:
                secretKeyRef:
                  name: branching-secret
                  key: branch-merge-user
            - name: BRANCH_MERGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: branching-secret
                  key: branch-merge-password
            - name: OGGIT_FDW_USERMAPPING_KEY
              valueFrom:
                secretKeyRef:
                  name: branching-secret
                  key: oggit-usermapping-key
          ports:
            - name: postgres
              containerPort: 55433
            - name: http
              containerPort: 3080
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - /usr/local/__OG_VERSION__/bin/gsql -d postgres -U cloud_admin -p 55433 -h 127.0.0.1 -c 'SELECT 1' >/dev/null
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - /usr/local/__OG_VERSION__/bin/gsql -d postgres -U cloud_admin -p 55433 -h 127.0.0.1 -c 'SELECT 1' >/dev/null
            periodSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: data
              mountPath: /var/db/gaussdb
            - name: control-plane
              mountPath: /data/.neon/control_plane
            - name: scripts
              mountPath: /opt/branching/compute.sh
              subPath: compute.sh
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: control-plane
          hostPath:
            path: __DATA_ROOT__/control-plane
            type: DirectoryOrCreate
        - name: scripts
          hostPath:
            path: __COMPUTE_SHELL_DIR__
            type: Directory
